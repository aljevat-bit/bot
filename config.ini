; config.ini
[settings]
db_path = trading_data2.db
backtesting_db_path = backtesting_data.db
portfolio_state_path = portfolio_state.json
use_testnet = False

[strategy]
; Parámetros comunes para el motor de trading
deliberation_interval_seconds = 15
reflex_interval_seconds = 2

[strategy_medium_term]
; Estrategia de mediano plazo basada en cruce de medias móviles y RSI
context_tf = 1h
ema_slow_period = 200
ema_fast_period = 50
setup_tf = 15m
ema_pullback_period = 21
trigger_tf = 5m
rsi_period = 14
rsi_oversold = 35
rsi_overbought = 65
sma_short_window = 20
sma_long_window = 50
rsi_window = 14

[strategy_scalping]
; Estrategia de corto plazo (operaciones rápidas)
bias_tf = 15m
vwap_bias_ema_period = 20
setup_tf = 1m
trigger_tf = 5s
momentum_ticks = 3

[risk]
stop_loss_percentage = 2.0
take_profit_percentage = 5.0

[position_sizing]
max_open_positions = 5

[portfolio]
btcusdt = 100
ethusdt = 75